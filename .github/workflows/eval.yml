name: Full eval

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 0' # Sundays, 03:00 IST

permissions:
  contents: read

env:
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Cache models and passage embeddings
        uses: actions/cache@v6
        with:
          path: |
            .cache/fastembed
            data/processed/emb-*.npy
          key: models-${{ hashFiles('data/processed/chunks.jsonl') }}
          restore-keys: models-
      # "file" is the exported index the Space serves (NIYAM_INDEX=file); it must match e5 in memory.
      - run: python scripts/eval_retrieval.py --configs bm25,e5,hybrid,file --gate

  answers:
    runs-on: ubuntu-latest
    needs: retrieval
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v6
        with:
          path: |
            .cache/fastembed
            data/processed/emb-*.npy
          key: models-${{ hashFiles('data/processed/chunks.jsonl') }}
          restore-keys: models-
      - name: Check for an LLM key
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GEMINI_API_KEY secret is not set, so the answer eval did not run."
          fi
      - name: Answer eval with faithfulness judge
        if: steps.key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/eval_answers.py --judge --gate
